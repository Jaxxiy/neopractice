version: '3.8'

services:
  # ===== БАЗЫ ДАННЫХ =====
  postgres-reservation:
    image: postgres:17
    container_name: postgres-reservation
    environment:
      POSTGRES_DB: reservation_db
      POSTGRES_USER: reservation_user
      POSTGRES_PASSWORD: reservation_password
    ports:
      - "5432:5432"
    volumes:
      - postgres-reservation-data:/var/lib/postgresql/data
    networks:
      - neopractice-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reservation_user -d reservation_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  postgres-product:
    image: postgres:17
    container_name: postgres-product
    environment:
      POSTGRES_DB: product_db
      POSTGRES_USER: product_user
      POSTGRES_PASSWORD: product_password
    ports:
      - "5433:5432"
    volumes:
      - postgres-product-data:/var/lib/postgresql/data
    networks:
      - neopractice-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U product_user -d product_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    depends_on:
      - postgres-reservation
      - postgres-product
    networks:
      - neopractice-network
    restart: unless-stopped

  # ===== RABBITMQ =====
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
      RABBITMQ_DEFAULT_VHOST: /
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - neopractice-network
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  # ===== MIKROSERVISY =====
  product-service:
    build:
      context: ./product-service
      dockerfile: Dockerfile
    container_name: product-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-product:5432/product_db
      SPRING_DATASOURCE_USERNAME: product_user
      SPRING_DATASOURCE_PASSWORD: product_password
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: admin
      SPRING_RABBITMQ_PASSWORD: admin
      SPRING_LIQUIBASE_ENABLED: "false"
      JAVA_OPTS: "-Xmx512m -Xms256m"
    ports:
      - "8082:8082"
    depends_on:
      postgres-product:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - neopractice-network
    restart: unless-stopped

  reservation-service:
    build:
      context: ./reservation-service
      dockerfile: Dockerfile
    container_name: reservation-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-reservation:5432/reservation_db
      SPRING_DATASOURCE_USERNAME: reservation_user
      SPRING_DATASOURCE_PASSWORD: reservation_password
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: admin
      SPRING_RABBITMQ_PASSWORD: admin
      SPRING_LIQUIBASE_ENABLED: "false"
      PRODUCT_SERVICE_URL: http://product-service:8082
      JAVA_OPTS: "-Xmx512m -Xms256m"
    ports:
      - "8081:8081"
    depends_on:
      postgres-reservation:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      product-service:
        condition: service_started
    networks:
      - neopractice-network
    restart: unless-stopped

  # ===== GRAVITEE API GATEWAY (ИСПРАВЛЕННАЯ ВЕРСИЯ) =====

  # База данных для Gravitee
  gravitee-postgres:
    image: postgres:17
    container_name: gravitee-postgres
    environment:
      POSTGRES_DB: gravitee
      POSTGRES_USER: gravitee
      POSTGRES_PASSWORD: gravitee
    ports:
      - "5434:5432"
    volumes:
      - gravitee-postgres-data:/var/lib/postgresql/data
    networks:
      - neopractice-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gravitee -d gravitee"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Gravitee Management API (исправленное имя образа)
  gravitee-api:
    image: graviteeio/apim-management-api:latest
    container_name: gravitee-api
    environment:
      MGMT_API_PORT: 8093

      GRAVITEE_MANAGEMENT_TYPE: jdbc

      GRAVITEE_MANAGEMENT_JDBC_URL: jdbc:postgresql://gravitee-postgres:5432/gravitee
      GRAVITEE_MANAGEMENT_JDBC_USERNAME: gravitee
      GRAVITEE_MANAGEMENT_JDBC_PASSWORD: gravitee

      GRAVITEE_ANALYTICS_TYPE: none  # <-- это ключевая переменная!

      # Отключаем уведомления (чтобы убрать WARN)
      GRAVITEE_NOTIFICATION_ENABLED: "false"

      # JWT для аутентификации
      GRAVITEE_SECURITY_DEFAULT_PROVIDER: jwt
      GRAVITEE_SECURITY_JWT_SECRET: myJWT4Gr4v1teeSecretKey
      GRAVITEE_SECURITY_JWT_ISSUER: gravitee.io
    ports:
      - "8093:8083"
      - "8083:8083"
    depends_on:
      gravitee-postgres:
        condition: service_healthy
    networks:
      - neopractice-network
    restart: unless-stopped

  # Gravitee Gateway (исправленное имя образа)
  gravitee-gateway:
    image: graviteeio/apim-gateway:latest
    container_name: gravitee-gateway
    environment:
      GRAVITEE_REPOSITORIES_MANAGEMENT_TYPE: jdbc
      GRAVITEE_REPOSITORIES_MANAGEMENT_JDBC_URL: jdbc:postgresql://gravitee-postgres:5432/gravitee
      GRAVITEE_REPOSITORIES_MANAGEMENT_JDBC_USERNAME: gravitee
      GRAVITEE_REPOSITORIES_MANAGEMENT_JDBC_PASSWORD: gravitee

      # Синхронизация с Management API
      GRAVITEE_MANAGEMENT_SYNC_ENABLED: "true"
      GRAVITEE_MANAGEMENT_SYNC_ENDPOINT: http://gravitee-api:8093/management/organizations/DEFAULT/environments/DEFAULT/apis
      GRAVITEE_MANAGEMENT_SYNC_SECRET: mySyncSecretKey

      # Отключаем аналитику
      GRAVITEE_REPORTERS_ELASTICSEARCH_ENABLED: "false"
    ports:
      - "8092:8082"
    depends_on:
      gravitee-postgres:
        condition: service_healthy
      gravitee-api:
        condition: service_started
    networks:
      - neopractice-network
    restart: unless-stopped

  # Gravitee Management Console (исправленное имя образа)
  gravitee-ui:
    image: graviteeio/apim-management-ui:latest
    container_name: gravitee-ui
    environment:
      MGMT_API_URL: http://localhost:8083/management
      PORTAL_API_URL: http://localhost:8083/portal
    ports:
      - "8090:8080"
    depends_on:
      - gravitee-api
    networks:
      - neopractice-network
    restart: unless-stopped

volumes:
  postgres-reservation-data:
  postgres-product-data:
  rabbitmq-data:
  gravitee-postgres-data:

networks:
  neopractice-network:
    driver: bridge